# Default values for story-creator.
# Override with values-prod.yaml for production deployments.

# Namespace where all resources are deployed.
namespace: story-creator

image:
  repository: charly37/storycreator
  tag: latest
  pullPolicy: IfNotPresent
  # Image built from pythonDockerBaseImage/Dockerfile (DialectHubAgent scripts).
  scripts:
    repository: charly37/storycreator-scripts
    # Empty means "use image.tag" (set both with --set image.tag=...)
    tag: ""
    pullPolicy: IfNotPresent

replicaCount: 1

app:
  nodeEnv: production
  port: 3000
  # Requests per minute per API key on /api/v1
  publicApiRateLimitPerMin: 60
  # trace | debug | info | warn | error | fatal | silent
  logLevel: info

ingress:
  host: bilingualstory.net
  # Use letsencrypt-staging for first-time testing to avoid rate limits
  clusterIssuer: letsencrypt-prod
  tlsSecretName: storycreator-tls

certManager:
  email: admin@bilingualstory.net
  # Set to false for secondary releases to skip creating ClusterIssuers
  # that were already created by the primary (prod) release.
  createIssuers: true

# Scheduled agent that invents a story idea and creates it through the public API.
# Requires `storycreator-api-key` in the story-creator-secrets secret. The key must
# be created in Profile → API keys with "Allow creating stories (uses AI)" enabled.
storyCreatorAgent:
  enabled: true
  # Mondays at 08:00 (cluster timezone)
  schedule: "0 8 * * 1"
  # Temporarily paused: story creation moved to the caller side while the change
  # is validated. Set back to false (or set enabled: false to remove the CronJob
  # entirely) once the external trigger is confirmed working.
  suspend: true
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Must be greater than the agent's --timeout (default 900s)
  activeDeadlineSeconds: 1200

  # In-cluster API URL. Empty defaults to http://<release>-app (the chart Service).
  apiUrl: ""

  apiKeySecret:
    name: story-creator-secrets
    key: storycreator-api-key

  # Arguments passed to StoryCreatorAgent.py.
  # Add "--no-publish" to keep generated stories as drafts, or
  # "--native-language", "fr" to target French learners.
  args:
    - "--level"
    - "beginner"
    - "--chapters"
    - "3"
    - "--sentences-per-chapter"
    - "8"

# Directory on the k3s node holding generated narration audio (clips + renders).
# The app mounts it read-only; the TTS worker mounts it read-write.
# The directory must exist on the node before `helm upgrade`, because the app mounts
# it with `type: Directory` (same convention as PortugueseLearning).
audio:
  hostPath: /home/ubuntu/StoryCreator/audio
  mountPath: /app/audio

# Text-to-speech queue worker (TtsWorker/TtsWorker.py), shipped in the same
# `storycreator-scripts` image as the story agent and started via a command override.
# Synthesizes one clip per sentence, then assembles the lang1 / lang2 / bilingual
# renders. Requires `mongodb-uri` and `text-to-speech-api-key` in the
# story-creator-secrets secret.
# Keep replicas at 1: the worker recovers crashed jobs by requeueing `processing`
# documents on startup, and clips are content-addressed so a restart resumes cheaply.
ttsWorker:
  enabled: false
  # Seconds between polls of the queue. Audio is user-triggered, so keep this small.
  pollInterval: 5
  # elevenlabs | fake (fake writes silence, so the pipeline can be tested for free).
  provider: elevenlabs
  # Provider speech speed. PortugueseLearning used 0.75 for word drills; narration
  # reads better at natural speed. Drop to ~0.85 for learners.
  speed: 1.0
  # Attempts before a request is marked failed. Re-requesting from the UI resets it.
  maxAttempts: 3
  # Optional voice ID applied to every language; empty uses TtsWorker/voices.py.
  voice: ""
  # Accepts pino-style or Python-style levels (info, warn, error, debug, ...).
  logLevel: info
  mongoSecret:
    name: story-creator-secrets
    key: mongodb-uri
  textToSpeechSecret:
    name: story-creator-secrets
    key: text-to-speech-api-key

resources:
  app:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  storyCreatorAgent:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  ttsWorker:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "story-creator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
        {{- include "story-creator.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.app.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: PUBLIC_API_RATE_LIMIT_PER_MIN
              value: {{ .Values.app.publicApiRateLimitPerMin | default 60 | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | default "info" | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: story-creator-secrets
                  key: mongodb-uri
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: story-creator-secrets
                  key: session-secret
            - name: OPEN_AI_KEY
              valueFrom:
                secretKeyRef:
                  name: story-creator-secrets
                  key: open-ai-key
            - name: AUDIO_PATH
              value: {{ .Values.audio.mountPath | default "/app/audio" | quote }}
          volumeMounts:
            # Read-only: only the TTS worker writes narration audio.
            - name: audio
              mountPath: {{ .Values.audio.mountPath | default "/app/audio" | quote }}
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.app.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
      volumes:
        # DirectoryOrCreate so a missing audio directory degrades to "no audio yet"
        # instead of blocking the whole app. The worker owns writing into it; see
        # docs/TTS_WORKER.md for the ownership requirement.
        - name: audio
          hostPath:
            path: {{ .Values.audio.hostPath | quote }}
            type: DirectoryOrCreate

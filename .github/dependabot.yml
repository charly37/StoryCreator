version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # @mui/material and @mui/icons-material must move in lockstep: icons-material
    # declares a peer of @mui/material@^<same-minor>, so bumping one alone breaks
    # `npm ci` with ERESOLVE.
    groups:
      mui:
        patterns:
          - "@mui/*"

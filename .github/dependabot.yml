version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      npm-dependencies:
        patterns:
          - "*"
      # @mui/material and @mui/icons-material must move in lockstep: icons-material
      # declares a peer of @mui/material@^<same-minor>, so bumping one alone breaks
      # `npm ci` with ERESOLVE.
      mui:
        patterns:
          - "@mui/*"

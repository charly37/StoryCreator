name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build server
      run: npm run build:server

    - name: Build client
      run: npm run build:client

    - name: Verify build output
      run: |
        if [ ! -d "dist" ] || [ ! -f "public/bundle.js" ]; then
          echo "Build failed - missing dist/ or public/bundle.js"
          exit 1
        fi

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Get short commit SHA
      id: vars
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set image tags
      id: tags
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          echo "app_tag=dev-${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
          echo "floating_tag=dev" >> $GITHUB_OUTPUT
        else
          echo "app_tag=${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
          echo "floating_tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Build Docker image
      run: docker build -t storycreator:${{ steps.tags.outputs.app_tag }} .

    - name: Test Docker image with MongoDB
      run: |
        # Create isolated network for container communication
        docker network create test-network

        # Start MongoDB container
        docker run -d --name test-mongo --network test-network mongo:latest
        sleep 5

        # Start app container connected via container hostname
        docker run -d -p 3000:3000 --name test-app --network test-network \
          -e MONGODB_URI=mongodb://test-mongo:27017/storycreator-test \
          -e SESSION_SECRET=test-secret-key \
          storycreator:${{ steps.tags.outputs.app_tag }}

        # Wait for app to be ready (retry up to 60s)
        for i in $(seq 1 30); do
          if curl -sf http://localhost:3000/api/health; then
            echo "App is ready"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "App failed to start after 60s"
            docker logs test-app
            exit 1
          fi
          echo "Waiting for app... attempt $i"
          sleep 2
        done

        # Cleanup
        docker stop test-app test-mongo
        docker rm test-app test-mongo
        docker network rm test-network

    - name: Push to Docker Hub
      if: github.event_name != 'pull_request'
      run: |
        # Tag and push with commit-specific tag
        docker tag storycreator:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/storycreator:${{ steps.tags.outputs.app_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/storycreator:${{ steps.tags.outputs.app_tag }}

        # Also push floating tag (latest or dev)
        docker tag storycreator:${{ steps.tags.outputs.app_tag }} ${{ vars.DOCKER_USERNAME }}/storycreator:${{ steps.tags.outputs.floating_tag }}
        docker push ${{ vars.DOCKER_USERNAME }}/storycreator:${{ steps.tags.outputs.floating_tag }}

    - name: Create deployment info
      if: github.event_name != 'pull_request'
      run: |
        echo "Deployment Info" > deployment-info.txt
        echo "===============" >> deployment-info.txt
        echo "Commit SHA: ${{ github.sha }}" >> deployment-info.txt
        echo "Short SHA: ${{ steps.vars.outputs.short_sha }}" >> deployment-info.txt
        echo "Branch: ${{ github.ref_name }}" >> deployment-info.txt
        echo "Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> deployment-info.txt
        echo "" >> deployment-info.txt
        echo "Docker Image:" >> deployment-info.txt
        echo "  - ${{ vars.DOCKER_USERNAME }}/storycreator:${{ steps.tags.outputs.app_tag }}" >> deployment-info.txt
        cat deployment-info.txt

    - name: Upload deployment info
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: deployment-info-${{ steps.vars.outputs.short_sha }}
        path: deployment-info.txt
        retention-days: 90

  k8s-validate:
    needs: docker-build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Get short commit SHA
      id: vars
      run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set image tag
      id: tags
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          echo "app_tag=dev-${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
        else
          echo "app_tag=${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Install Helm
      run: curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - name: Lint Helm chart
      run: helm lint helm/story-creator

    - name: Install kubeconform
      run: |
        curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
        sudo mv kubeconform /usr/local/bin/

    - name: Validate rendered Helm chart with kubeconform
      run: |
        helm template story-creator helm/story-creator \
          --set image.tag=${{ steps.tags.outputs.app_tag }} \
          | kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.35.4 \
            -
        echo "All manifests are valid"

    - name: Package Helm chart
      run: |
        helm package helm/story-creator \
          --app-version ${{ steps.tags.outputs.app_tag }} \
          --destination .
        echo "Helm chart packaged: $(ls story-creator-*.tgz)"

    - name: Upload Helm chart artifact
      uses: actions/upload-artifact@v7
      with:
        name: helm-chart-${{ steps.vars.outputs.short_sha }}
        path: story-creator-*.tgz
        retention-days: 90
